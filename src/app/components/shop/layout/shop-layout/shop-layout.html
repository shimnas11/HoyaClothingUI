<div class="shop-shell">

    <!-- ================= HEADER ================= -->
    <header class="shop-header">

        <!-- Brand -->
        <a class="shop-header__brand" routerLink="/shop/home" aria-label="Hoya Clothing home">

            <span class="shop-header__mark">
                H
            </span>

            <span class="shop-header__name">
                Hoya Clothing
            </span>

        </a>


        <!-- Header Actions -->
        <div class="shop-header__actions">

            <!-- Search -->
            <button class="shop-header__icon-btn" type="button" aria-label="Search">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">

                    <circle cx="11" cy="11" r="7" />

                    <line x1="21" y1="21" x2="16.65" y2="16.65" />

                </svg>

            </button>


            <!-- Cart -->
            <a class="shop-header__icon-btn" routerLink="/shop/cart" aria-label="Cart">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M4 6h2l1.6 9.6a2 2 0 0 0 2 1.7h7.1a2 2 0 0 0 2-1.6L20 9H6.2" />

                    <circle cx="9.5" cy="20" r="1.2" fill="currentColor" stroke="none" />

                    <circle cx="17" cy="20" r="1.2" fill="currentColor" stroke="none" />

                </svg>

            </a>

        </div>

    </header>


    <!-- ================= MAIN CONTENT ================= -->
    <main class="shop-content">

        <router-outlet></router-outlet>

    </main>


    <!-- ================= MOBILE BOTTOM NAVIGATION ================= -->
    <nav class="shop-bottom-nav" aria-label="Primary navigation">

        <a *ngFor="let item of navItems" class="shop-bottom-nav__item" [routerLink]="item.path"
            routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.path === '/shop/home' }">

            <!-- Icon -->
            <span class="shop-bottom-nav__icon">

                @switch (item.icon) {

                <!-- HOME -->
                @case ('home') {

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M3 11.5 12 4l9 7.5" />

                    <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4h4v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9" />

                </svg>

                }


                <!-- SHOP -->
                @case ('shop') {

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M6 8h12l-1 12H7L6 8Z" />

                    <path d="M9 8a3 3 0 0 1 6 0" />

                </svg>

                }


                <!-- CART -->
                @case ('cart') {

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">

                    <path d="M4 6h2l1.6 9.6a2 2 0 0 0 2 1.7h7.1a2 2 0 0 0 2-1.6L20 9H6.2" />

                    <circle cx="9.5" cy="20" r="1.2" fill="currentColor" stroke="none" />

                    <circle cx="17" cy="20" r="1.2" fill="currentColor" stroke="none" />

                </svg>

                }


                <!-- ACCOUNT -->
                @case ('account') {

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                    stroke-linejoin="round">

                    <circle cx="12" cy="8" r="3.4" />

                    <path d="M5 20c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4" />

                </svg>

                }

                }

            </span>


            <!-- Label -->
            <span class="shop-bottom-nav__label">
                {{ item.label }}
            </span>

        </a>

    </nav>

</div>
