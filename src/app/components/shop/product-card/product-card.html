<article class="product-card">

    <!-- Product / Details clickable area -->
    <a class="product-card__link" [routerLink]="['/shop/products', product.id]"
        [attr.aria-label]="'View ' + product.name">

        <div class="product-card__image">

            <img *ngIf="productImageUrl" class="product-card__img" [src]="productImageUrl" [alt]="product.name"
                loading="lazy" />

            <span *ngIf="!productImageUrl" class="product-card__image-placeholder" aria-hidden="true">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">

                    <rect x="3" y="4" width="18" height="16" rx="2" />

                    <path d="M3 15.5 8.5 10l4 4 3-3L21 15.5" />

                    <circle cx="8" cy="8.5" r="1.4" fill="currentColor" stroke="none" />

                </svg>

            </span>

            <span class="product-card__badge" *ngIf="product.badge">
                {{ product.badge }}
            </span>

        </div>

        <div class="product-card__info">

            <p class="product-card__name">
                {{ product.name }}
            </p>

            <p class="product-card__material">
                {{ product.material }}
            </p>

            <p class="product-card__price">

                <span class="product-card__price-current">
                    {{ product.price | currency:'INR':'symbol':'1.0-0':'en-IN' }}
                </span>

                <span class="product-card__price-original" *ngIf="product.originalPrice">

                    {{ product.originalPrice | currency:'INR':'symbol':'1.0-0':'en-IN' }}

                </span>

            </p>

        </div>

    </a>


    <!-- Wishlist stays outside the link -->
    <button class="product-card__favorite" type="button" [class.is-active]="product.isFavorite"
        [attr.aria-pressed]="!!product.isFavorite" [attr.aria-label]="
            product.isFavorite
                ? 'Remove from wishlist'
                : 'Add to wishlist'
        " (click)="onFavoriteClick($event)">

        <svg viewBox="0 0 24 24" [attr.fill]="product.isFavorite ? 'currentColor' : 'none'" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

            <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z">
            </path>

        </svg>

    </button>

</article>
